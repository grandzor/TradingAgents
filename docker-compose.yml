services:
  tradeyuk:
    build: .
    env_file:
      - .env
    volumes:
      - TRADEYUK_data:/home/appuser/.tradeyuk
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradeyuk-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - TRADEYUK_data:/home/appuser/.tradeyuk
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  TRADEYUK_data:
  ollama_data:
