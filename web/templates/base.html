<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tradeyuk{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230ECB81'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui' font-weight='800' font-size='18' fill='%230B0E11'>T</text></svg>">
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">
        <span class="icon">T</span>
        <span>Tradeyuk</span>
    </a>
    <ul class="navbar-links">
        <li><a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Beranda</a></li>
        <li><a href="/prices" {% if request.url.path == '/prices' %}class="active"{% endif %}>Harga</a></li>
        <li><a href="/history" {% if request.url.path == '/history' %}class="active"{% endif %}>Riwayat</a></li>
        <li><a href="/schedules" {% if request.url.path == '/schedules' %}class="active"{% endif %}>Jadwal</a></li>
    </ul>
</nav>

{% block content %}{% endblock %}

<footer class="footer">
    <p>Tradeyuk &copy; {{ now().year if now is defined else '2025' }} &mdash; Framework Trading Finansial Multi-Agen LLM</p>
    <p>Dibangun oleh <a href="https://github.com/Grandzor" target="_blank" rel="noopener">Grandzor</a></p>
</footer>

<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
